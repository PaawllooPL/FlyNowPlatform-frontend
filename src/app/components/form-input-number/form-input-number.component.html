<mat-form-field appearance="fill" class="form-text-input">
    <mat-label>{{inputLabel}}</mat-label>
    <input type="number" [formControlName]="inputFormControlName" matInput placeholder={{inputPlaceholder}}>
    <mat-icon matSuffix>{{inputIcon}}</mat-icon>
    <mat-hint>{{inputHint}}</mat-hint>
</mat-form-field>
