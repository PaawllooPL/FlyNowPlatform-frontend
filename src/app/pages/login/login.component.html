<div id="login-card" class="rounded-tab">
    <mat-form-field appearance="fill" class="logging-input form-input">
        <mat-label>Email</mat-label>
        <input matInput placeholder="jan.kowalski@gmail.com">
        <mat-icon matSuffix>alternate_email</mat-icon>
        <mat-hint>Email użyty podczas rejestracji</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="fill" class="logging-input">
        <mat-label>Hasło</mat-label>
        <input matInput [type]="hide() ? 'password': 'text'" placeholder="MojeHaslo123!#">
        <button
            mat-icon-button
            matSuffix
            (click)="togglePasswordVisibility($event)"    
        >
            <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-hint>Hasło użyte podczas rejestracji</mat-hint>
    </mat-form-field>
    <app-list-button-container>
        <app-list-button class="large-button" link="/login" icon="fingerprint" text="Zaloguj"></app-list-button>
        <app-list-button class="small-button" link="/register" icon="fiber_new" text="Zarejestruj"></app-list-button>
        <app-list-button class="small-button" link="/register" icon="help" text="Przypomnij hasło"></app-list-button>
    </app-list-button-container>
</div>
