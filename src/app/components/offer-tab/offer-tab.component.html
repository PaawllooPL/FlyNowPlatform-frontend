<img src="swietokrzyski_park_narodowy.jpg" class="offer-image">
<div class="offer-info-container">
    <div class="offer-title" id="offer-title">{{title}}</div>
    <div>
        <div class="offer-detail-container">
            <div class="offer-detail-label">pozostałe miejsca:</div>
            <div class="offer-detail-info">{{remainingSeats}}</div>
        </div>
        <div class="offer-detail-container">
            <div class="offer-detail-label">cena za osobe:</div>
            <div class="offer-detail-info">{{pricePerPerson}}</div>
        </div>
    </div>
    <div class="example-button-container">
        <button mat-fab extended>
            Sprawdź ofertę
            <mat-icon>arrow_right_alt</mat-icon>
        </button>
    </div>
</div>
