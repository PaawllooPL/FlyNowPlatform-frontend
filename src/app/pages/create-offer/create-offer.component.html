<div class="rounded-tab offer-form-container">

    <form [formGroup]="createOfferForm" (ngSubmit)="onCreateFormSubmit()" id="add-offer-form">
        
        <app-form-input-text inputPlaceholder="Przelot awionetką nad pięknym lasem" inputLabel="Tytuł oferty"
            inputFormControlName="createOfferTitle"></app-form-input-text>
        
        <div class="row-container">
            <div class="three-per-row-item">
                <app-form-input-text inputPlaceholder="8" inputLabel="Liczba miejsc"
                    inputFormControlName="createOfferSeats"></app-form-input-text>
            </div>
            <div class="three-per-row-item">
                <app-form-input-text inputFormControlName="createOfferPrice" inputPlaceholder="399"
                    inputLabel="Cena"></app-form-input-text>
            </div>
            <div class="three-per-row-item">
                <label for="select-type-id"><span id="select-type-label">Typ statku powietrznego</span></label>
                <select id="select-type-id" class="select-type" formControlName="aircraftTypeOption">
                    <option *ngFor="let type of aircraftTypes" [value]="type">{{type}}</option>
                </select>
            </div>
        </div>
        <div class="row-container">
            <div class="two-per-row-item">
                <app-form-input-number inputPlaceholder="45" inputFormControlName="createOfferDuration" inputLabel="Długość lotu"></app-form-input-number>
            </div>
            <div class="two-per-row-item">
                <mat-form-field>
                    <mat-label>Meeting date</mat-label>
                    <input matInput [matDatepicker]="datepicker">
                    <mat-datepicker #datepicker/>
                    <mat-datepicker-toggle [for]="datepicker" matSuffix/>
                  </mat-form-field>
                  
                <!-- <app-form-input-date></app-form-input-date> -->
            </div>
        </div>
        
        <fieldset id="description-fieldset">
            <legend style="margin: 0 auto; font-size: 1.3rem;">Opis</legend>
            <textarea formControlName="createOfferDescription" id="description-textarea" rows="5"></textarea>
        </fieldset>
        
        <button type="button" mat-fab extended (click)="fileInput.click()">
            <mat-icon>photo</mat-icon>Choose File</button>
        <input formControlName="createOfferImage" hidden (change)="onFileSelected($event)" #fileInput type="file"
            accept="image/*">
        <span class="file-name">{{selectedFile?.name}}</span>
        
        <div class="submit-button-container">
            <app-list-submit-button text="Dodaj ofertę" icon="add_to_photos"></app-list-submit-button>
        </div>
    </form>
</div>
